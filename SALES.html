<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Sales Tracker - Medical Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for Graph -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Jab tak login check na ho, content chupaye rakhein -->
    <style>
        #appContainer { display: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans text-slate-800">

    <!-- Loading Screen jab tak auth check ho raha hai -->
    <div id="loadingScreen" class="flex flex-col items-center justify-center min-h-screen bg-slate-100">
        <i class="fas fa-spinner fa-spin text-4xl text-emerald-600 mb-3"></i>
        <p class="text-slate-600 font-medium">Login Check ho raha hai...</p>
    </div>

    <!-- Main App Container (Login ke baad hi dikhega) -->
    <div id="appContainer">
        <!-- Navbar -->
        <nav class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
            <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fas fa-chart-line text-2xl"></i>
                    <span class="font-bold text-lg tracking-wide">DAILY SALES</span>
                </div>
                <div class="flex items-center space-x-3">
                    <a href="ORDER.html" class="bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded text-sm font-medium transition">
                        <i class="fas fa-pills mr-1"></i> Orders
                    </a>
                    <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-sm font-medium transition">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Container -->
        <main class="max-w-6xl mx-auto p-4 space-y-6">

            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-emerald-500">
                    <p class="text-sm text-slate-500 font-medium">Aaj Ki Sale (Today)</p>
                    <h2 id="todaySale" class="text-2xl font-bold text-slate-800 mt-1">₹0</h2>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-500">
                    <p class="text-sm text-slate-500 font-medium">Is Mahine Ki Sale (This Month)</p>
                    <h2 id="monthSale" class="text-2xl font-bold text-slate-800 mt-1">₹0</h2>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-purple-500">
                    <p class="text-sm text-slate-500 font-medium">Total Recorded Sale</p>
                    <h2 id="totalSale" class="text-2xl font-bold text-slate-800 mt-1">₹0</h2>
                </div>
            </div>

            <!-- Entry Form & Graph Section -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                
                <!-- Left: Daily Sale Entry Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm h-fit">
                    <h3 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2">
                        <i class="fas fa-plus-circle text-emerald-600 mr-2"></i>Nayi Sale Entry
                    </h3>
                    <form id="saleForm" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Tarikh (Date)</label>
                            <input type="date" id="saleDate" required 
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Cash Sale (₹)</label>
                            <input type="number" id="cashAmount" placeholder="0" min="0" required 
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Online / UPI Sale (₹)</label>
                            <input type="number" id="onlineAmount" placeholder="0" min="0" required 
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">Note (Optional)</label>
                            <input type="text" id="saleNote" placeholder="Koi khas baat ya kharcha..." 
                                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        </div>
                        <button type="submit" id="saveBtn"
                            class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg shadow transition duration-200">
                            <i class="fas fa-save mr-1"></i> Sale Save Karein
                        </button>
                    </form>
                </div>

                <!-- Right: Sales Graph -->
                <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-2 flex flex-col justify-between">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h3 class="text-lg font-bold text-slate-800">
                            <i class="fas fa-chart-bar text-blue-600 mr-2"></i>Sales Graph (Last 15 Entries)
                        </h3>
                        <select id="chartType" class="text-sm border border-slate-300 rounded px-2 py-1 focus:outline-none">
                            <option value="bar">Bar Chart</option>
                            <option value="line">Line Chart</option>
                        </select>
                    </div>
                    <div class="relative w-full h-72">
                        <canvas id="salesChart"></canvas>
                    </div>
                </div>

            </div>

            <!-- Sales History Table -->
            <div class="bg-white rounded-xl shadow-sm overflow-hidden">
                <div class="p-5 border-b flex justify-between items-center">
                    <h3 class="text-lg font-bold text-slate-800">
                        <i class="fas fa-history text-slate-600 mr-2"></i>Rozana Sale Record
                    </h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 text-sm uppercase border-b">
                                <th class="py-3 px-4">Date</th>
                                <th class="py-3 px-4">Cash (₹)</th>
                                <th class="py-3 px-4">Online (₹)</th>
                                <th class="py-3 px-4">Total (₹)</th>
                                <th class="py-3 px-4">Note</th>
                                <th class="py-3 px-4 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="salesTableBody" class="divide-y divide-slate-200 text-sm">
                            <tr>
                                <td colspan="6" class="py-6 text-center text-slate-400">Data load ho raha hai...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <!-- Firebase SDKs & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBEKFojdvg__D1G1bFxAhW8hOrGF02UCJU",
            authDomain: "medical-8c32b.firebaseapp.com",
            databaseURL: "https://medical-8c32b-default-rtdb.firebaseio.com",
            projectId: "medical-8c32b",
            storageBucket: "medical-8c32b.firebasestorage.app",
            messagingSenderId: "110333435801",
            appId: "1:110333435801:web:5abc3c7c35c8e19d22fd08",
            measurementId: "G-HRGC036927"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Strict Authentication Check
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                localStorage.removeItem('isLoggedIn');
                window.location.href = "index.html";
            } else {
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                loadSalesData();
            }
        });

        // Logout Button
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => {
                localStorage.removeItem('isLoggedIn');
                window.location.href = "index.html";
            });
        });

        // Set Default Date to Today
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('saleDate').value = todayStr;

        // Save Daily Sale
        document.getElementById('saleForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = document.getElementById('saleDate').value;
            const cash = Number(document.getElementById('cashAmount').value) || 0;
            const online = Number(document.getElementById('onlineAmount').value) || 0;
            const note = document.getElementById('saleNote').value.trim();
            const total = cash + online;

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Saving...';

            try {
                await set(ref(db, 'daily_sales/' + date), {
                    date: date,
                    cash: cash,
                    online: online,
                    total: total,
                    note: note
                });

                document.getElementById('cashAmount').value = '';
                document.getElementById('onlineAmount').value = '';
                document.getElementById('saleNote').value = '';
                alert("Sale safaltapurvak save ho gayi!");
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fas fa-save mr-1"></i> Sale Save Karein';
            }
        });

        let salesChart = null;
        let globalSalesList = [];

        // Load Data from Firebase
        function loadSalesData() {
            const salesRef = ref(db, 'daily_sales');
            onValue(salesRef, (snapshot) => {
                const data = snapshot.val();
                const tbody = document.getElementById('salesTableBody');
                tbody.innerHTML = '';
                globalSalesList = [];

                if (!data) {
                    tbody.innerHTML = '<tr><td colspan="6" class="py-6 text-center text-slate-400">Abhi tak koi sale entry nahi hai.</td></tr>';
                    updateSummary([]);
                    renderChart([]);
                    return;
                }

                const salesArray = Object.values(data).sort((a, b) => new Date(b.date) - new Date(a.date));
                globalSalesList = [...salesArray].reverse();

                salesArray.forEach((item) => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-slate-50 transition";
                    tr.innerHTML = `
                        <td class="py-3 px-4 font-medium text-slate-800">${formatDate(item.date)}</td>
                        <td class="py-3 px-4 text-emerald-700 font-medium">₹${item.cash.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-4 text-blue-700 font-medium">₹${item.online.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-4 font-bold text-slate-900">₹${item.total.toLocaleString('en-IN')}</td>
                        <td class="py-3 px-4 text-slate-500">${item.note || '-'}</td>
                        <td class="py-3 px-4 text-center">
                            <button onclick="deleteEntry('${item.date}')" class="text-red-500 hover:text-red-700 p-1" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                updateSummary(salesArray);
                renderChart(globalSalesList);
            });
        }

        // Delete Entry Function
        window.deleteEntry = function(dateKey) {
            if (confirm(`Kya aap ${formatDate(dateKey)} ki sale entry delete karna chahte hain?`)) {
                remove(ref(db, 'daily_sales/' + dateKey));
            }
        };

        // Update Top Summary Cards
        function updateSummary(salesArray) {
            const currentMonth = todayStr.slice(0, 7);
            let todayTotal = 0;
            let monthTotal = 0;
            let allTimeTotal = 0;

            salesArray.forEach(item => {
                allTimeTotal += item.total;
                if (item.date === todayStr) {
                    todayTotal += item.total;
                }
                if (item.date.startsWith(currentMonth)) {
                    monthTotal += item.total;
                }
            });

            document.getElementById('todaySale').innerText = `₹${todayTotal.toLocaleString('en-IN')}`;
            document.getElementById('monthSale').innerText = `₹${monthTotal.toLocaleString('en-IN')}`;
            document.getElementById('totalSale').innerText = `₹${allTimeTotal.toLocaleString('en-IN')}`;
        }

        // Render Chart.js Graph
        function renderChart(ascendingList) {
            const ctx = document.getElementById('salesChart').getContext('2d');
            const chartType = document.getElementById('chartType').value;

            const recentData = ascendingList.slice(-15);
            const labels = recentData.map(item => formatDate(item.date));
            const totals = recentData.map(item => item.total);
            const onlineData = recentData.map(item => item.online);

            if (salesChart) {
                salesChart.destroy();
            }

            salesChart = new Chart(ctx, {
                type: chartType,
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Total Sale (₹)',
                            data: totals,
                            backgroundColor: 'rgba(16, 185, 129, 0.7)',
                            borderColor: 'rgb(5, 150, 105)',
                            borderWidth: 2,
                            tension: 0.3
                        },
                        {
                            label: 'Online / UPI (₹)',
                            data: onlineData,
                            backgroundColor: 'rgba(59, 130, 246, 0.6)',
                            borderColor: 'rgb(37, 99, 235)',
                            borderWidth: 2,
                            tension: 0.3
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'top' }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        document.getElementById('chartType').addEventListener('change', () => {
            renderChart(globalSalesList);
        });

        function formatDate(dateStr) {
            const [y, m, d] = dateStr.split('-');
            return `${d}-${m}-${y}`;
        }
    </script>
</body>
</html>
