<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORDER - ऑर्डर मैनेजमेंट सिस्टम</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4f46e5',
                        secondary: '#0ea5e9',
                    }
                }
            }
        }
    </script>
    <style>
        #appContainer { display: none; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- Loading Screen -->
    <div id="loadingScreen" class="flex flex-col items-center justify-center min-h-screen bg-slate-50">
        <div class="text-center">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600 mx-auto mb-3"></div>
            <p class="text-slate-600 font-medium text-sm">लॉगिन जाँच हो रही है...</p>
        </div>
    </div>

    <div id="appContainer">
        <!-- Header -->
        <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-4xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-2">
                <h1 class="text-xl font-bold">📦 ORDER - मैनेजमेंट सिस्टम</h1>
                <div class="space-x-2 flex items-center flex-wrap gap-y-1">
                    <a href="index.html" class="px-3 py-1.5 rounded-lg bg-indigo-800 hover:bg-indigo-900 font-medium text-sm transition">डैशबोर्ड</a>
                    <button onclick="switchTab('orderForm')" id="btnOrderForm" class="px-3 py-1.5 rounded-lg bg-indigo-700 font-medium text-sm transition shadow-sm">नया ऑर्डर</button>
                    <button onclick="switchTab('orderList')" id="btnOrderList" class="px-3 py-1.5 rounded-lg hover:bg-indigo-700 font-medium text-sm transition">ऑर्डर लिस्ट</button>
                    <button onclick="logout()" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-700 font-medium text-sm transition">लॉग आउट</button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 py-6">

            <!-- TAB 1: New Order Form & Item Management -->
            <section id="tabOrderForm" class="space-y-6">
                <!-- Add New Item Card -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold text-slate-700 mb-3 flex items-center gap-2">
                        <span>➕</span> नया आइटम जोड़ें
                    </h2>
                    <div class="flex flex-col sm:flex-row gap-3">
                        <input type="text" id="newItemName" placeholder="आइटम का नाम दर्ज करें (जैसे: Paracetamol)" class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <button type="button" onclick="addNewItem()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-5 py-2 rounded-lg transition shadow-sm flex items-center justify-center gap-1">
                            जोड़ें और सेव करें
                        </button>
                    </div>
                    <p class="text-xs text-slate-500 mt-2">नोट: एक बार जोड़ा गया आइटम हमेशा के लिए सलेक्ट करने के लिए उपलब्ध हो जाएगा।</p>
                </div>

                <!-- Create Order Form -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
                        <span>📝</span> ऑर्डर फॉर्म
                    </h2>
                    
                    <form id="orderFormElement" onsubmit="saveOrder(event)" class="space-y-4">
                        <!-- Select Item with Search/Filter capability -->
                        <div class="relative">
                            <label class="block text-sm font-medium text-slate-600 mb-1">आइटम चुनें या खोजें (Search Item)</label>
                            <div class="flex gap-2">
                                <input type="text" id="itemSearchInput" placeholder="आइटम का नाम टाइप करके खोजें..." oninput="filterItems()" onfocus="showDropdownList()" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white" autocomplete="off">
                                <input type="hidden" id="selectedItemValue" required>
                                <button type="button" onclick="toggleDropdownList()" class="bg-slate-200 hover:bg-slate-300 px-3 py-2 rounded-lg text-slate-700 transition">▼</button>
                            </div>
                            
                            <!-- Dropdown suggestions list box -->
                            <div id="itemDropdownList" class="hidden absolute z-10 w-full mt-1 bg-white border border-slate-300 rounded-lg shadow-lg max-h-48 overflow-y-auto">
                                <!-- Populated dynamically -->
                            </div>
                        </div>

                        <!-- Quantity -->
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">मात्रा (Quantity)</label>
                            <input type="number" id="itemQuantity" min="1" value="1" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </div>

                        <!-- Distributor -->
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">डिस्ट्रीब्यूटर चुनें</label>
                            <select id="distributorSelect" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                                <option value="">-- डिस्ट्रीब्यूटर सलेक्ट करें --</option>
                                <option value="TARA">TARA</option>
                                <option value="MEDICO">MEDICO</option>
                                <option value="NEHA">NEHA</option>
                                <option value="BADADA">BADADA</option>
                                <option value="HARSH">HARSH</option>
                                <option value="modern">modern</option>
                                <option value="SHREE JI">SHREE JI</option>
                                <option value="BAFNA">BAFNA</option>
                                <option value="RAJESH">RAJESH</option>
                                <option value="BASWA">BASWA</option>
                                <option value="KANCHAN">KANCHAN</option>
                                <option value="PS">PS</option>
                                <option value="GANERAL">GANERAL</option>
                                <option value="LADDU">LADDU</option>
                                <option value="OTHER">OTHER</option>
                            </select>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="saveOrderBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md">
                            ऑर्डर सेव करें
                        </button>
                    </form>
                </div>
            </section>

            <!-- TAB 2: Order List (Distributor Wise) -->
            <section id="tabOrderList" class="hidden space-y-6">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-semibold text-slate-700 flex items-center gap-2">
                        <span>📋</span> डिस्ट्रीब्यूटर वाइज ऑर्डर लिस्ट
                    </h2>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button type="button" onclick="removeAllOrders()" class="bg-rose-600 hover:bg-rose-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition shadow-sm flex-1 sm:flex-none">
                            सभी रिमूव करें
                        </button>
                    </div>
                </div>

                <!-- Container for Distributor Groups -->
                <div id="distributorContainers" class="space-y-6">
                    <!-- Dynamically populated list -->
                </div>
            </section>

        </main>
    </div>

    <!-- Firebase SDKs (Auth + Cloud Firestore) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import {
            getFirestore,
            collection,
            doc,
            addDoc,
            setDoc,
            getDocs,
            deleteDoc,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEKFojdvg__D1G1bFxAhW8hOrGF02UCJU",
            authDomain: "medical-8c32b.firebaseapp.com",
            projectId: "medical-8c32b",
            storageBucket: "medical-8c32b.firebasestorage.app",
            messagingSenderId: "110333435801",
            appId: "1:110333435801:web:5abc3c7c35c8e19d22fd08",
            measurementId: "G-HRGC036927"
        };

        const app = initializeApp(firebaseConfig);
        try { getAnalytics(app); } catch (e) {}

        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseSignOut = signOut;
        window.firestoreDb = db;
        window.fsCollection = collection;
        window.fsDoc = doc;
        window.fsAddDoc = addDoc;
        window.fsSetDoc = setDoc;
        window.fsGetDocs = getDocs;
        window.fsDeleteDoc = deleteDoc;
        window.fsOnSnapshot = onSnapshot;

        let ordersUnsubscribe = null;
        let itemsUnsubscribe = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('user');
                sessionStorage.clear();
                window.location.href = "login.html";
            } else {
                localStorage.setItem('isLoggedIn', 'true');
                if (user.email) localStorage.setItem('user', user.email);
                document.getElementById('loadingScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                startFirestoreListeners();
            }
        });

        function startFirestoreListeners() {
            if (itemsUnsubscribe) itemsUnsubscribe();
            if (ordersUnsubscribe) ordersUnsubscribe();

            // Listen to custom items in Firestore ('order_items')
            itemsUnsubscribe = onSnapshot(collection(db, 'order_items'), (snapshot) => {
                const defaultItems = ["Paracetamol", "Cough Syrup", "Vitamin C", "Bandage Roll"];
                const loaded = [];
                snapshot.forEach((docSnap) => {
                    const d = docSnap.data();
                    if (d && d.name) loaded.push(d.name);
                });
                const merged = Array.from(new Set([...defaultItems, ...loaded]));
                window.updateAppItems(merged);
            }, (err) => {
                console.error("Items listener error:", err);
            });

            // Listen to orders in Firestore ('orders')
            ordersUnsubscribe = onSnapshot(collection(db, 'orders'), (snapshot) => {
                const list = [];
                snapshot.forEach((docSnap) => {
                    list.push({ id: docSnap.id, ...docSnap.data() });
                });
                window.updateAppOrders(list);
            }, (err) => {
                console.error("Orders listener error:", err);
            });
        }
    </script>

    <!-- Application Logic -->
    <script>
        window.logout = function() {
            localStorage.removeItem('isLoggedIn');
            localStorage.removeItem('user');
            sessionStorage.clear();
            if (window.firebaseAuth && window.firebaseSignOut) {
                window.firebaseSignOut(window.firebaseAuth)
                    .then(() => { window.location.href = "login.html"; })
                    .catch(() => { window.location.href = "login.html"; });
            } else {
                window.location.href = "login.html";
            }
        };

        let items = ["Paracetamol", "Cough Syrup", "Vitamin C", "Bandage Roll"];
        let orders = [];

        window.updateAppItems = function(newItems) {
            items = newItems;
            renderItemListDropdown(items);
        };

        window.updateAppOrders = function(newOrders) {
            orders = newOrders;
            renderOrderLists();
        };

        window.addEventListener('DOMContentLoaded', function() {
            renderItemListDropdown(items);
            renderOrderLists();

            document.addEventListener('click', function(e) {
                if (!e.target.closest('#itemSearchInput') && !e.target.closest('#itemDropdownList') && !e.target.closest('button[onclick="toggleDropdownList()"]')) {
                    const dropdown = document.getElementById('itemDropdownList');
                    if (dropdown) dropdown.classList.add('hidden');
                }
            });
        });

        window.switchTab = function(tabName) {
            const tabOrderForm = document.getElementById('tabOrderForm');
            const tabOrderList = document.getElementById('tabOrderList');
            const btnOrderForm = document.getElementById('btnOrderForm');
            const btnOrderList = document.getElementById('btnOrderList');

            if (tabName === 'orderForm') {
                tabOrderForm.classList.remove('hidden');
                tabOrderList.classList.add('hidden');
                btnOrderForm.classList.add('bg-indigo-700');
                btnOrderList.classList.remove('bg-indigo-700');
            } else {
                tabOrderForm.classList.add('hidden');
                tabOrderList.classList.remove('hidden');
                btnOrderList.classList.add('bg-indigo-700');
                btnOrderForm.classList.remove('bg-indigo-700');
                renderOrderLists();
            }
        };

        function renderItemListDropdown(filteredItems) {
            const dropdown = document.getElementById('itemDropdownList');
            if (!dropdown) return;
            dropdown.innerHTML = '';

            if (filteredItems.length === 0) {
                dropdown.innerHTML = '<div class="px-4 py-2 text-sm text-slate-400">कोई आइटम नहीं मिला</div>';
                return;
            }

            filteredItems.slice().sort().forEach(item => {
                const div = document.createElement('div');
                div.className = 'px-4 py-2 text-sm text-slate-700 hover:bg-indigo-50 cursor-pointer transition';
                div.textContent = item;
                div.onclick = function() {
                    selectItem(item);
                };
                dropdown.appendChild(div);
            });
        }

        window.showDropdownList = function() {
            document.getElementById('itemDropdownList').classList.remove('hidden');
            filterItems();
        };

        window.toggleDropdownList = function() {
            const dropdown = document.getElementById('itemDropdownList');
            if (dropdown.classList.contains('hidden')) {
                window.showDropdownList();
            } else {
                dropdown.classList.add('hidden');
            }
        };

        window.filterItems = function() {
            const query = document.getElementById('itemSearchInput').value.toLowerCase();
            const filtered = items.filter(item => item.toLowerCase().includes(query));
            renderItemListDropdown(filtered);
            document.getElementById('itemDropdownList').classList.remove('hidden');
        };

        function selectItem(itemName) {
            document.getElementById('itemSearchInput').value = itemName;
            document.getElementById('selectedItemValue').value = itemName;
            document.getElementById('itemDropdownList').classList.add('hidden');
        }

        window.addNewItem = async function() {
            const input = document.getElementById('newItemName');
            const itemName = input.value.trim();

            if (!itemName) {
                alert('कृपया आइटम का नाम दर्ज करें!');
                return;
            }

            if (items.some(i => i.toLowerCase() === itemName.toLowerCase())) {
                alert('यह आइटम पहले से सूची में मौजूद है!');
                return;
            }

            try {
                const docId = encodeURIComponent(itemName.toLowerCase());
                await window.fsSetDoc(window.fsDoc(window.firestoreDb, 'order_items', docId), {
                    name: itemName,
                    createdAt: Date.now()
                });
                selectItem(itemName);
                input.value = '';
                alert('आइटम Firestore में सफलतापूर्वक जोड़ दिया गया है!');
            } catch (error) {
                console.error("Error adding item to Firestore:", error);
                alert("आइटम सेव करने में त्रुटि आई: " + error.message);
            }
        };

        window.saveOrder = async function(event) {
            event.preventDefault();

            const itemName = document.getElementById('selectedItemValue').value || document.getElementById('itemSearchInput').value.trim();
            const quantity = Number(document.getElementById('itemQuantity').value);
            const distributor = document.getElementById('distributorSelect').value;
            const saveBtn = document.getElementById('saveOrderBtn');

            if (!itemName || !quantity || !distributor) {
                alert('कृपया आइटम, मात्रा और डिस्ट्रीब्यूटर सही से भरें!');
                return;
            }

            saveBtn.disabled = true;
            saveBtn.textContent = 'सेव हो रहा है...';

            try {
                if (!items.some(i => i.toLowerCase() === itemName.toLowerCase())) {
                    const docId = encodeURIComponent(itemName.toLowerCase());
                    await window.fsSetDoc(window.fsDoc(window.firestoreDb, 'order_items', docId), {
                        name: itemName,
                        createdAt: Date.now()
                    });
                }

                await window.fsAddDoc(window.fsCollection(window.firestoreDb, 'orders'), {
                    item: itemName,
                    quantity: quantity,
                    distributor: distributor,
                    date: new Date().toLocaleDateString('hi-IN'),
                    timestamp: Date.now()
                });

                document.getElementById('orderFormElement').reset();
                document.getElementById('selectedItemValue').value = "";
                document.getElementById('itemQuantity').value = "1";
                renderItemListDropdown(items);
                window.switchTab('orderList');
            } catch (error) {
                console.error("Error saving order to Firestore:", error);
                alert("ऑर्डर सेव करने में त्रुटि आई: " + error.message);
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'ऑर्डर सेव करें';
            }
        };

        function renderOrderLists() {
            const container = document.getElementById('distributorContainers');
            if (!container) return;
            container.innerHTML = '';

            const distributors = [
                "TARA", "MEDICO", "NEHA", "BADADA", "HARSH",
                "modern", "SHREE JI", "BAFNA", "RAJESH", "BASWA",
                "KANCHAN", "PS", "GANERAL", "LADDU", "OTHER"
            ];

            distributors.forEach(dist => {
                const distOrders = orders.filter(o => o.distributor === dist);

                let cardHTML = `
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                        <div class="bg-slate-100 px-5 py-3 border-b border-slate-200 flex justify-between items-center">
                            <h3 class="font-bold text-slate-700 flex items-center gap-2">
                                <span class="w-3 h-3 rounded-full bg-indigo-500 inline-block"></span> 
                                डिस्ट्रीब्यूटर: ${dist}
                            </h3>
                            <span class="text-xs bg-indigo-100 text-indigo-700 font-semibold px-2.5 py-1 rounded-full">
                                ${distOrders.length} आइटम
                            </span>
                        </div>
                        <div class="p-4">
                `;

                if (distOrders.length === 0) {
                    cardHTML += `<p class="text-sm text-slate-400 text-center py-4">इस डिस्ट्रीब्यूटर के लिए कोई ऑर्डर नहीं है।</p>`;
                } else {
                    cardHTML += `
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse text-sm">
                                <thead>
                                    <tr class="border-b border-slate-200 text-slate-500">
                                        <th class="py-2 px-3">आइटम का नाम</th>
                                        <th class="py-2 px-3">मात्रा (Qty)</th>
                                        <th class="py-2 px-3 text-right">कारवाई</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    distOrders.forEach(order => {
                        cardHTML += `
                            <tr class="border-b border-slate-100 hover:bg-slate-50 transition">
                                <td class="py-2.5 px-3 font-medium text-slate-700">${order.item}</td>
                                <td class="py-2.5 px-3 text-slate-600">${order.quantity}</td>
                                <td class="py-2.5 px-3 text-right">
                                    <button type="button" onclick="removeOrder('${order.id}')" class="text-rose-600 hover:text-rose-800 text-xs font-semibold px-2.5 py-1 rounded border border-rose-200 hover:bg-rose-50 transition">
                                        रिमूव करें
                                    </button>
                                </td>
                            </tr>
                        `;
                    });

                    cardHTML += `
                                </tbody>
                            </table>
                        </div>
                    `;
                }

                cardHTML += `
                        </div>
                    </div>
                `;

                container.innerHTML += cardHTML;
            });
        }

        window.removeOrder = async function(orderId) {
            if (confirm('क्या आप इस आइटम को ऑर्डर लिस्ट से हटाना चाहते हैं?')) {
                try {
                    await window.fsDeleteDoc(window.fsDoc(window.firestoreDb, 'orders', orderId));
                } catch (error) {
                    console.error("Error removing order:", error);
                    alert("हटाने में त्रुटि आई: " + error.message);
                }
            }
        };

        window.removeAllOrders = async function() {
            if (confirm('क्या आप सभी डिस्ट्रीब्यूटर के सभी ऑर्डर रिमूव करना चाहते हैं?')) {
                try {
                    const snap = await window.fsGetDocs(window.fsCollection(window.firestoreDb, 'orders'));
                    const deletions = [];
                    snap.forEach((docSnap) => {
                        deletions.push(window.fsDeleteDoc(window.fsDoc(window.firestoreDb, 'orders', docSnap.id)));
                    });
                    await Promise.all(deletions);
                } catch (error) {
                    console.error("Error removing all orders:", error);
                    alert("सभी ऑर्डर हटाने में त्रुटि आई: " + error.message);
                }
            }
        };
    </script>
</body>
</html>
